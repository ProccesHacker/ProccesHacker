<!doctype html>
<html><head><meta charset="utf-8"><title>preview</title>
<style>
  body{margin:0;padding:40px;background:#000;font-family:sans-serif;}
  .wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
  .row{display:flex;gap:20px;}
  img{display:block;border-radius:20px;}
  .row img{width:calc(50% - 10px);height:auto;}
  .full{width:100%;height:auto;}
</style></head>
<body><div class="wrap">
  <img class="full" src="assets/header.svg"/>
  <div class="row">
    <img src="assets/about.svg"/>
    <img src="assets/stack.svg"/>
  </div>
  <img class="full" src="assets/projects.svg"/>
  <div class="row">
    <img src="assets/stats.svg"/>
    <img src="assets/contact.svg"/>
  </div>
</div></body></html>
