<!doctype html>
<html><head><meta charset="utf-8"><title>preview</title>
<style>
  body{margin:0;padding:40px;background:#000;font-family:sans-serif;}
  .wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
  .row{display:flex;gap:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  img{display:block;border-radius:20px;width:100%;height:auto;}
  .row > img, .row > a{width:calc(50% - 10px);}
  .row > a img{width:100%;}
  a{display:block;}
</style></head>
<body><div class="wrap">
  <img src="assets/header.svg"/>
  <div class="row">
    <img src="assets/about.svg"/>
    <img src="assets/stack.svg"/>
  </div>
  <img src="assets/projects_header.svg"/>
  <div class="grid">
    <a href="https://github.com/ProccesHacker/Rendy-obfuscator-deobfuscator"><img src="assets/card_rendy.svg"/></a>
    <a href="https://github.com/ProccesHacker/devmystical-obfuscator-deobfuscator"><img src="assets/card_devmystical.svg"/></a>
    <a href="https://github.com/ProccesHacker/hyperion-obfuscator-deobfuscator"><img src="assets/card_hyperion.svg"/></a>
    <a href="https://github.com/ProccesHacker/BlankV2-obfuscator-deobfuscator"><img src="assets/card_blankv2.svg"/></a>
    <a href="https://github.com/ProccesHacker/apollyon-obfuscator-deobfuscator"><img src="assets/card_apollyon.svg"/></a>
    <img src="assets/card_more.svg"/>
  </div>
  <div class="row">
    <img src="assets/stats.svg"/>
    <img src="assets/contact.svg"/>
  </div>
</div></body></html>
